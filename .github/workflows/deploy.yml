name: Deploy

on:
  workflow_run:
    workflows: ["Build & Verify"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-production-site.example # Optional

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10.11.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for all check runs to complete (excluding self)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_JOB_NAME: deploy
        run: |
          MAX_RETRIES=30
          SLEEP_TIME=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Checking check run statuses... (attempt $i)"
            statuses=$(gh api repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs \
              --jq '[.check_runs[] | {name, status, conclusion}]')

            incomplete=$(echo "$statuses" | jq -r --arg CURRENT "$CURRENT_JOB_NAME" '.[] | select(.name != $CURRENT and .status != "completed") | "- \(.name) [\(.status)]"')
            if [[ -z "$incomplete" ]]; then
              failed=$(echo "$statuses" | jq -r --arg CURRENT "$CURRENT_JOB_NAME" '.[] | select(.name != $CURRENT and .conclusion != "success") | "- \(.name) [\(.conclusion)]"')
              if [[ -z "$failed" ]]; then
                echo "All check runs (excluding self) completed successfully."
                exit 0
              else
                echo "Some check runs failed:"
                echo "$failed"
                exit 1
              fi
            else
              echo "Some check runs still in progress (excluding self):"
              echo "$incomplete"
              sleep $SLEEP_TIME
            fi
          done

          echo "Timed out waiting for check runs to complete."
          exit 1

      - name: Find existing GitHub deployment
        id: find_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          DEPLOY_ID=$(gh api \
            /repos/$REPO/deployments \
            --jq '.[] | select(.ref == env.COMMIT_SHA and .environment == "production") | .id' \
            | head -n 1)
          
          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ No existing deployment found for $COMMIT_SHA in production"
            exit 1
          fi
          
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        id: deploy_to_vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
          NEW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
          set -e
          export PATH="/root/.nvm/versions/node/v22.16.0/bin:$PATH"
          cd /opt/discord-bot

          echo "Fetching latest from origin..."
          git fetch --all --prune
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" "+refs/pull/*/head:refs/remotes/origin/pr/*"
          git fetch origin $NEW_COMMIT
          echo "Cleaning working directory..."
          git reset --hard
          git clean -fd

          echo "Checking if commit $NEW_COMMIT exists..."
          if git cat-file -e $NEW_COMMIT^{commit}; then
            git reset --hard $NEW_COMMIT
          else
            echo "Warning: Commit not found, defaulting to origin/master."
            git reset --hard origin/master
          fi

          echo "Installing dependencies..."
          pnpm install --frozen-lockfile
          export PATH="$PATH:/root/.local/share/pnpm"
          
          echo "Clearing PM2 logs..."
          /root/.local/share/pnpm/pm2 flush
          
          echo "Reloading bot via PM2..."
          if ! /root/.local/share/pnpm/pm2 reload discord-bot; then
            echo "PM2 reload failed — attempting to start..."
            /root/.local/share/pnpm/pm2 start "pnpm start" --name discord-bot
          fi

          echo "Waiting 60 seconds to check stability..."
          sleep 60

          echo "Checking if bot is online..."
          if ! /root/.local/share/pnpm/pm2 status discord-bot | grep -q "online"; then
            echo "❌ PM2 process is not online after start/reload"
            exit 1
          fi

          echo "Checking PM2 logs for recent errors..."
          if tail -n 50 /root/.pm2/logs/discord-bot-error.log | grep -i "error"; then
          echo "❌ Error found in recent PM2 logs"
          exit 1
          fi

          echo "Saving PM2 process list..."
          /root/.local/share/pnpm/pm2 save
          EOF

      - name: Mark deployment as successful
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/deployments/${{ steps.find_deployment.outputs.deployment_id }}/statuses \
          -f state=success

      - name: Mark deployment as failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/deployments/${{ steps.find_deployment.outputs.deployment_id }}/statuses \
          -f state=failure

      - name: Rollback on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/discord-bot

            if [ ! -f .last_good_commit ]; then
              echo "No previous commit found for rollback."
              exit 1
            fi

            echo "Rolling back to previous commit..."
            LAST_COMMIT=$(cat .last_good_commit)
            git reset --hard $LAST_COMMIT

            export PATH="/root/.nvm/versions/node/v22.16.0/bin:\$PATH"
            pnpm install --frozen-lockfile

            sudo systemctl restart discord-bot.service
          EOF