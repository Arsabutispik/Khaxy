name: Deploy Bot

on:
  push:
    branches: [ "master" ]
    paths:
      # Only run when bot-related files change
      - 'apps/bot/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'ecosystem.config.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Load bashrc to get nvm and pnpm paths
            source ~/.bashrc
            
            # Stop the script if any command fails
            set -e

            # 1. Navigate to project folder
            cd ~/Khaxy

            # 2. Pull the latest code
            git pull origin master

            # 3. Install dependencies
            # --filter ... loads the bot + its dependencies + workspace root tools (like Typescript)
            # We do NOT use --prod here because we need devDeps (like tsc) to build
            pnpm install --filter khaxyrewrite...

            # 4. Generate Prisma Client
            pnpm db:generate

            # 5. Build the Bot (TypeScript -> JavaScript)
            pnpm --filter khaxyrewrite run build

            # 6. Restart/Reload via PM2
            # This picks up new env vars and code changes automatically
            pm2 startOrReload ecosystem.config.js