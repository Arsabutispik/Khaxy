name: Production Pipeline

on:
  push:
    branches: [ "master" ]
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'ecosystem.config.js'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v2
        with:
          version: '10.11.1'
      - run: pnpm install
      - run: pnpm db:generate
      - run: pnpm type-check
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v2
        with:
          version: '10.11.1'
      - run: pnpm install
      - run: pnpm lint
  i18n-check:
    name: i18n Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v2
        with:
          version: '10.11.1'
      - run: pnpm install
      - run: pnpm --filter khaxyrewrite run validate-translations:ci
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="/root/.nvm/versions/node/v24.11.1/bin:$PATH"
            
            echo "Node version: $(node -v)"
            echo "PNPM version: $(pnpm -v)"
            set -e
            
            cd ~/Khaxy
            git pull origin master
            
            # Install & Build
            pnpm install --filter khaxyrewrite...
            pnpm db:generate
            pnpm --filter khaxyrewrite run build
            
            # Restart
            pm2 startOrReload ecosystem.config.js