services:
  weblate-db:
    image: postgres:17-alpine
    container_name: weblate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${WEBLATE_DB_PASSWORD:-weblate_secure_pass}
      POSTGRES_DB: weblate
    volumes:
      - weblate_db_data:/var/lib/postgresql/data
    networks:
      - weblate-network

  weblate-cache:
    image: redis:7-alpine
    container_name: weblate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - weblate_redis_data:/data
    networks:
      - weblate-network

  weblate:
    image: weblate/weblate:latest
    container_name: khaxy-weblate
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      - POSTGRES_HOST=weblate-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=weblate
      - POSTGRES_USER=weblate
      - POSTGRES_PASSWORD=${WEBLATE_DB_PASSWORD:-weblate_secure_pass}

      # Redis Configuration
      - REDIS_HOST=weblate-cache
      - REDIS_PORT=6379

      # Admin & Site Configuration
      - WEBLATE_ADMIN_NAME=${WEBLATE_ADMIN_NAME:-Admin}
      - WEBLATE_ADMIN_EMAIL=${WEBLATE_ADMIN_EMAIL:-admin@khaxy.net}
      - WEBLATE_ADMIN_PASSWORD=${WEBLATE_ADMIN_PASSWORD:-admin}
      - WEBLATE_SITE_DOMAIN=${WEBLATE_SITE_DOMAIN}
      - WEBLATE_ALLOWED_HOSTS=${WEBLATE_SITE_DOMAIN},localhost,127.0.0.1
      - WEBLATE_ENABLE_HTTPS=0

      # Proton Mail SMTP Configuration
      - WEBLATE_SERVER_EMAIL=${WEBLATE_EMAIL_FROM:-noreply@khaxy.net}
      - WEBLATE_DEFAULT_FROM_EMAIL=${WEBLATE_EMAIL_FROM:-noreply@khaxy.net}
      - WEBLATE_EMAIL_HOST=smtp.protonmail.ch
      - WEBLATE_EMAIL_PORT=587
      - WEBLATE_EMAIL_HOST_USER=${PROTON_EMAIL}
      - WEBLATE_EMAIL_HOST_PASSWORD=${PROTON_APP_PASSWORD}
      - WEBLATE_EMAIL_USE_TLS=1
      - WEBLATE_EMAIL_USE_SSL=0
      - WEBLATE_EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend

      # Registration Configuration - Email only
      - WEBLATE_REGISTRATION_OPEN=1
      - WEBLATE_REGISTRATION_ALLOW_BACKENDS=email
      - WEBLATE_REGISTRATION_CAPTCHA=1

      # Enable avatars (should work fine with Docker DNS)
      - WEBLATE_ENABLE_AVATARS=1

    volumes:
      - weblate_data:/app/data
    depends_on:
      - weblate-db
      - weblate-cache
    networks:
      - weblate-network

volumes:
  weblate_db_data:
  weblate_redis_data:
  weblate_data:

networks:
  weblate-network:
    driver: bridge