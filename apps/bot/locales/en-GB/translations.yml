ping: >-
  This command was run by {{interaction.user.username}}, who joined on
  {{interaction.member.joinedAt}}.
mod_log:
  warning: >-
    ⚠️ **{{user.username}}** has been warned by **{{moderator.username}}**.
    Reason:```{{reason}}```
  ban: >-
    {{emoji}}  **{{user.username}}** has been banned by
    **{{moderator.username}}**. Reason:```{{reason}}```
  kick: "\U0001F462  **{{user.username}}** has been kicked by **{{moderator.username}}**. Reason:```{{reason}}```"
  mute: "\U0001F507  **{{user.username}}** has been muted by **{{moderator.username}}** for **{{duration}}**. Reason:```{{reason}}```"
  timed_ban: >-
    {{emoji}}  **{{user.username}}** has been banned by
    **{{moderator.username}}** for **{{duration}}**. Reason:```{{reason}}```
  change_warn: >-
    <t:{{time}}> `[{{case}}]` ✏️ Case #{{case}}, has been modified by
    **{{moderator.username}}**. Reason:```{{reason}}```
  unban: "\U0001F513 User (`{{user.id}}`) has been unbanned by **{{moderator.username}}**. Reason:```{{reason}}```"
  ban_expired: "\U0001F513 User (`{{user.id}}`) has been automatically unbanned by **{{moderator.username}}** after **{{duration}}**. Reason:```{{reason}}```"
  timeout: "\U0001F507 **{{user.username}}** has been timed out by **{{moderator.username}}** for **{{duration}}**. Reason:```{{reason}}```"
  unmute: "\U0001F50A  **{{user.username}}** has been unmuted by **{{moderator.username}}**. Reason:```{{reason}}```"
  function_errors:
    no_guild_config: >-
      Guild config not found, creating one. This stops the mod_log_operation. To
      disable this warning, change the "Function Warnings" setting.
    channel_error: >-
      An error occurred while trying to send the message. This is likely due to
      the channel being deleted or the bot not having permission to send
      messages. Please check the channel and try again. This error removes the
      mod log channel ID from the guild config.
    case_id_error: >-
      An error occurred while trying to increment the case ID. This is likely a
      database error on our side. This may cause duplicate case IDs. Please
      report this to the bot developers.
    no_modlog_channel: >-
      No mod log channel is set in the guild config. Please set one to enable
      mod logs.
