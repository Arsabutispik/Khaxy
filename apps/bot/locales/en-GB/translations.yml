mod_mail_log:
  initial: >-
    # Mod-mail thread #{{thread_id}} with {{user.tag}} {{user.id}} started at
    {{time}}. All times are in GMT.
  bot_to_user: "[BOT TO USER]"
  command: "[COMMAND]"
  to_user: "[TO USER]"
  from_user: "[FROM USER]"
  to_thread: "[CHAT]"
  close_message: >-
    Mod-mail thread #{{thread_id}} with {{user.tag}} ({{user.id}}) was closed by
    {{closer.tag}}.

    **{{messages.user}}** messages from the user, **{{messages.staff}}**
    messages to the user, and **{{messages.internal}}** internal chat messages.
  preparing_close: Thread is being closed...
  thread_closed_dm: "Your thread in {{guild}} has been closed."
check_expired_modmail_blacklists:
  expired_modmail_blacklist_notification: "\U0001F514 Modmail blacklist for **{{guild}}** expired"
check_punishments:
  embed:
    title: User Roles Updated
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Roles Removed**: {{removed_roles}}
    added: Roles Added
infractions_punishment:
  no_mute_role: >-
    The mute role is not set. Please set the mute role in the moderation config
    to use this feature.
  already_muted: The user is already muted.
  no_permission: >-
    I do not have permission to mute this user. Please check the bot's role and
    permissions.
  reason: "Automatic punishment escalation (strike {{level}})"
  database_error: >-
    An error occurred while trying to add the infraction to the database. Please
    try again later.
  role_error: >-
    An error occurred while trying to add/remove a role. Please check the bot's
    permissions and try again.
  mute_error: >-
    An error occurred while trying to mute the user. Please check the bot's
    permissions and try again.
  messages:
    mute: >-
          You have been muted in **{{guild}}** for **{{duration}}**. Reason:
          ```{{reason}}```
    kick: >-
          You have been kicked from **{{guild}}**. Reason:
          ```{{reason}}```
    ban: >-
          You have been banned from **{{guild}}**. Reason:
          ```{{reason}}```
    temp_ban: >-
          You have been temporarily banned from **{{guild}}** for
          **{{duration}}**. Reason:```{{reason}}```