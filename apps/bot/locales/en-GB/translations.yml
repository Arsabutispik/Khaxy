  initial: |+
    This month's bump leaderboard:

  last_bump: "Last bump was made {{time}} by {{user}}."
  last_winner: >-
    Last month's winner: {{user}} with `{{count}}` bump out of
    **{{total_bumps}}** bumps.
  message_not_sent_by_bot: >-
    There are messages in the bump leaderboard channel that were not sent by the
    bot. Please remove them to avoid errors.
