channelCreate:
  unknown_executor: Unknown Executor
  embed:
    title: Channel Created
    description: |-
      > **Channel**: {{channel.name}} (<#{{channel.id}}>)
      >**ID**: {{channel.id}}
      > **Type**: {{channel_type}}
      > **Created At**: {{timestamp}}
  channel_types:
    "0": Text Channel
    "1": DM Channel
    "2": Voice Channel
    "3": Group DM Channel
    "4": Category Channel
    "5": News Channel
    "10": News Thread Channel
    "11": Public Thread Channel
    "12": Private Thread Channel
    "13": Stage Channel
    "14": Directory Channel
    "15": Forum Channel
    "16": Media Channel
channelDelete:
  unknown_executor: Unknown Executor
  embed:
    title: Channel Deleted
    description: |-
      > **Channel**: {{channel.name}} (<#{{channel.id}}>)
      > **ID**: {{channel.id}}
      > **Type**: {{channel_type}}
      > **Deleted At**: {{timestamp}}
  channel_types:
    "0": Text Channel
    "1": DM Channel
    "2": Voice Channel
    "3": Group DM Channel
    "4": Category Channel
    "5": News Channel
    "10": News Thread Channel
    "11": Public Thread Channel
    "12": Private Thread Channel
    "13": Stage Channel
    "14": Directory Channel
    "15": Forum Channel
    "16": Media Channel
channelUpdate:
  name_change:
    unknown_executor: Unknown Executor
    embed:
      title: Channel Name Changed
      description: |-
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Old Name**: {{old_name}}
        > **New Name**: {{new_name}}
  topic_change:
    unknown_executor: Unknown Executor
    embed:
      title: Channel Topic Changed
      description: |-
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Old Topic**: {{old_topic}}
        > **New Topic**: {{new_topic}}
  nsfw_change:
    unknown_executor: Unknown Executor
    embed:
      title: Channel NSFW Status Changed
      description: |-
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Old Status**: {{old_nsfw}}
        > **New Status**: {{new_nsfw}}
  permissions_change:
    unknown_executor: Unknown Executor
    embed:
      title: Channel Permission Overwrites Changed
      description: |-
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        **Changes**: {{changes}}
guildBanAdd:
  embed:
    title: User Banned From Server
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Joined At**: {{timestamp}}
    fields:
      reason: Reason
  no_reason: No reason provided.
  unknown_executor: Unknown Executor
  never_joined: User never joined the server.
guildBanRemove:
  embed:
    title: User Unbanned From Server
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
    fields:
      reason: Reason
guildMemberAdd:
  embed:
    title: User Joined Server
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Account Age**: {{timestamp}}
      > **Member Count**: {{member_count}}
guildMemberRemove:
  no_reason: No reason provided.
  user_left: "**User has left {{guild}}**"
  embed:
    title: User Left Server
    title_kicked: User Kicked From Server
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Joined At**: {{timestamp}}
      > **Member Count**: {{member_count}}
    fields:
      reason: Reason
  never_joined: User never joined the server.
  unknown_executor: Unknown Executor
guildMemberUpdate:
  unknown_executor: Unknown Executor
  timeout:
    no_reason: No reason provided for timeout.
    embed:
      title: User Timed Out
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Timeout Until**: {{timestamp}}
      fields:
        reason: Reason
  remove_timeout:
    no_reason: No reason provided for removing timeout.
    embed:
      title: User Timeout Removed
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
  roles_update:
    embed:
      title: User Roles Updated
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
      added: Roles Added
      removed: Roles Removed
  nickname_change:
    no_nickname: No Nickname
    embed:
      title: User Nickname Changed
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Old Nickname**: {{old_nickname}}
        > **New Nickname**: {{new_nickname}}
  username_change:
    embed:
      title: User Username Changed
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Old Username**: {{old_username}}
        > **New Username**: {{new_username}}
  avatar_change:
    embed:
      title: User Avatar Changed
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
guildUpdate:
  unknown_executor: Unknown Executor
  name_change:
    embed:
      title: Server Name Changed
      description: |-
        > **Old Name**: {{old_name}}
        > **New Name**: {{new_name}}
interactionCreate:
  memberMissingPermissions: >-
    You don't have the required `{{permissions}}` permissions to use this
    command.
messageBulkDelete:
  embed:
    title: "{{count}} Message(s) Deleted"
    description: "> **Channel**: {{message.channel.name}} (<#{{message.channel.id}}>)"
  file_name: deleted_messages.txt
  message: >-
    **Message ID:** {{message.id}} **Author:** {{message.author.tag}}
    **Content:** {{message.content}}
messageCreate:
  mod_mail:
    blacklisted: >-
      You are blacklisted from using mod mail in {{guild}}. Your blacklist
      reason is: **{{reason}}**. Your blacklist expires on: **{{expires}}**.
    never: Never
    initial: >-
      `Account Age:` **{{account_age}}**, `ID:` **{{user.id}}**

      `Username:` **{{user.username}}** (<@{{user.id}}>), `Join Date:`
      **{{join_date}}**

      **»»----------------------------¤----------------------------««**
    not_member: You are not a member of the server.
    confirm: "Yes"
    cancel: "No"
    confirm_title: Confirm Mod Mail Thread Button
    confirm_description: >-
      Click the button below to confirm the mod mail thread for {{guild}}, or
      click the cancel button to cancel the thread.
    timeout: You took too long to respond. The mod mail thread has been cancelled.
    cancelled_title: Mod Mail Thread Cancelled
    cancelled_description: "The mod mail thread for {{guild}} has been cancelled."
    confirmed_title: Mod Mail Thread Confirmed
    confirmed_description: >-
      The mod mail thread for {{guild}} has been confirmed and the conversation
      has begun.
    parent_channel_missing: >-
      Parent channel is missing. Moderators need to set the parent channel for
      the mod mail to work.
    channel_missing: >-
      Channel is missing. Moderators need to set the channel for the mod mail to
      work.
    topic: "Mod Mail conversation with {{user}}"
    error_sending: An error occurred while attempting to send the message.
    reopened: "{{user}} replied to modmail thread, thread won't be closed. ({{closer}})"
    error_inserting: >-
      An error occurred while attempting to insert the message into the
      database.
messageDelete:
  embed:
    title: Message Deleted
    description: >-
      > **Channel**: {{message.channel.name}} (<#{{message.channel.id}}>)

      > **Author**: {{message.author.tag}} (<@{{message.author.id}}>)

      > **Message ID**:
      [{{message.id}}](https://discord.com/channels/{{message.guild.id}}/{{message.channel.id}}/{{message.id}})

      > **Created At**: {{timestamp}}
    fields:
      content: Message
      attachments: "{{count}} Attachment(s)"
  skipped_files: ⚠️ Skipped Large Files
messageUpdate:
  message_edit: |-
    ***User edited their message.***
    ```diff
    - {{oldContent}}
    + {{newContent}}
    ```
  embed:
    title: Message Edited
    description: >-
      > **Channel**: {{message.channel.name}} (<#{{message.channel.id}}>)

      > **Author**: {{message.author.tag}} (<@{{message.author.id}}>)

      > **Message ID**:
      [{{message.id}}](https://discord.com/channels/{{message.guild.id}}/{{message.channel.id}}/{{message.id}})
    fields:
      oldContent: Before
      newContent: After
voiceStateUpdate:
  unknown_executor: Unknown Executor
  join:
    embed:
      title: User Joined Voice Channel
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **Joined At**: {{timestamp}}
  leave:
    embed:
      title: User Left Voice Channel
      title_kicked: User Kicked from Voice Channel
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Channel**: {{channel.name}} (<#{{channel.id}}>)
        > **Left At**: {{timestamp}}
  move:
    embed:
      title: User Moved Voice Channel
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Old Channel**: {{oldChannel.name}} (<#{{oldChannel.id}}>)
        > **New Channel**: {{newChannel.name}} (<#{{newChannel.id}}>)
        > **Moved At**: {{timestamp}}
