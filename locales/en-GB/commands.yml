    Use the menu below to navigate the settings. Each title can be clicked to
    view the documentation.
  none: N/A
  times_up: Time's up! You can no longer view the settings.
  embed:
    register:
      title: Register Settings
      fields:
        register_join_channel: Register Join Channel
        register_channel: Register Channel
        register_join_message: Register Join Message
        register_channel_clear: Clear Register Channel
    welcome_leave:
      title: Welcome/Leave Settings
      fields:
        welcome_channel: Welcome Channel
        welcome_message: Welcome Message
        leave_channel: Leave Channel
        leave_message: Leave Message
    moderation:
      title: Moderation Settings
      fields:
        mod_log_channel: Moderation Log Channel
        staff_role: Staff Role
        mod_mail_channel: Mod Mail Channel
        mute_get_all_roles: Mute Get All Roles
        register_day_limit: Register Day Limit
        default_expiry: Default Expiry
    role:
      title: Role Settings
      fields:
        color_of_the_day: Colour of the Day
        dj_role: DJ Role
        member_role: Member Role
        unverified_role: Unverified Role
        male_role: Male Role
        female_role: Female Role
        mute_role: Mute Role
    misc:
      title: Miscellaneous Settings
      fields:
        language: Language
        mod_mail_message: Mod Mail Message
    log:
      title: Log Settings
      fields:
        message_logs_channel: Message Logs Channel
close:
  no_thread: This is not a mod mail thread.
  no_time: A time unit has not been provided.
  no_duration: A duration has not been provided.
  error: Error while closing the thread.
  close_duration: "Thread will be closed in **{{duration}}**."
  close: Thread is being closed...
  thread_closed_dm: "Your thread in {{guild}} has been closed."
  thread_close_date: >-
    Thread is scheduled to be closed on **{{date}}**. Would you like to override
    this?
  accept: Override
  reject: Cancel
  timeout: "Timed out. The thread will be closed on **{{date}}**."
  thread_close_date_rejected: "Thread will be closed on **{{date}}**."
  thread_close_date_accepted: Continuing override...
reply:
  no_thread: This is not a mod mail thread.
  member_not_found: Member not found. Is the member still in the server?
  error: An error occurred while accessing the database.
  success: Message has been sent to the user.
  suspended: This mod mail thread has been suspended. Unsuspend the thread to reply.
  no_role: No Role
  anonymous: Anonymous
newthread:
  user_not_in_guild: The user is not a member of the server.
  no_modmail_channel: >-
    Mod mail channel not found. Update the mod mail channel with the /config
    command.
  modmail_channel_not_text: >-
    Mod mail channel is not a text channel. Update the mod mail channel in the
    channel settings.
  modmail_channel_not_in_parent: >-
    Mod mail channel is not in the same parent as the mod mail thread. Put the
    mod mail channel in the same parent as the mod mail thread or update the mod
    mail channel with the /config command.
  thread_already_exists: >-
    A thread already exists for this user. Close the thread or suspend before
    creating a new one.
  topic: "Mod Mail conversation with {{user}}"
  channel_create_failed: Could not create the channel.
  initial: >-
    `Account Age:` **{{account_age}}**, `ID:` **{{user.id}}**

    `Username:` **{{user.username}}** (<@{{user.id}}>), `Join Date:`
    **{{join_date}}**

    **»»----------------------------¤----------------------------««**
  message: "A thread with the `{{guild}}` has been created. **[{{user}}]:** {{message}}"
  dm_fail: Failed to send a DM to the user.
  created_by: "`Created by {{user}}`"
  db_error: Failed database query. Mod mail thread is dropped.
  message_send_failed: Message couldn't be delivered to thread. Mod mail thread is closed.
  thread_created: Thread has been created.
suspend:
  no_thread: This is not a mod mail thread.
  already_suspended: This mod mail thread is already suspended.
  suspended: >-
    This mod mail thread has been suspended. You can no longer reply to the
    user.
  error: >-
    An error occurred while suspending the thread. Developers have been
    notified.
close-cancel:
  no_thread: This is not a mod mail thread.
  not_closing: This mod mail thread is not marked for close.
  cancelled: The closing of this mod mail thread has been cancelled.
  error: An error occurred while cancelling the close. Developers have been notified.
unsuspend:
  no_thread: This is not a mod mail thread.
  not_suspended: This mod mail thread is not suspended.
  user_has_open_threads: User has a open thread. You can't unsuspend this thread.
  unsuspended: This mod mail thread has been unsuspended. You can now reply to the user.
  error: >-
    An error occurred while unsuspending the thread. Developers have been
    notified.
help:
  command_usage: Command Usage
  permissions: Permissions
  examples: Examples
  command_not_found: Command not found.
  command_help_not_found: Help for this command is not available.
  footer: "<param> are required parameters, [param] are optional parameters."
modmail-blacklist:
  no_reason: No reason provided for blacklisting.
  cannot_blacklist_self: You cannot blacklist yourself.
  cannot_blacklist_bot: You cannot blacklist a bot.
  duration_without_time: You must provide a time unit for the duration.
  time_without_duration: You must provide a duration for the time unit.
  blacklist_success: >-
    {{confirm}} **{{user}}** has been blacklisted for **{{duration}}** with
    reason: ```{{reason}}```
  blacklist_error: >-
    An error occurred while blacklisting the user. Developers have been
    notified.
  blacklist_remove:
    not_found: >-
      Blacklist entry for {{user}} not found. This means the user is not
      blacklisted.
    success: "{{confirm}} {{user}} has been removed from the blacklist."
    error: >-
      An error occurred while removing the user from the blacklist. Developers
      have been notified.
  blacklist_get:
    not_found: >-
      Blacklist entry for {{user}} not found. This means the user is not
      blacklisted.
    embed:
      title: "Blacklist Entry for {{user}}"
      fields:
        reason: Reason
        duration: Duration
        created_at: Blacklisted At
        expires_at: Expires At
        moderator: Responsible Moderator
purge:
  not_text_channel: This command can only be used in text channels.
  any:
    success: "{{confirm}} Successfully deleted **{{count}}** messages."
    error: An error occurred while deleting the messages. Please try again later.
  bots:
    success: "{{confirm}} Successfully deleted **{{count}}** messages from bots."
    error: An error occurred while deleting the bot messages. Please try again later.
  user:
    success: "{{confirm}} Successfully deleted **{{count}}** messages from **{{user}}**."
    error: >-
      An error occurred while deleting the messages from the user. Please try
      again later.
