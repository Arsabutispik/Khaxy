ban:
  expired: Ban has expired.
  cant_ban_self: You can't ban yourself.
  cant_ban_bot: You can't ban a bot.
  cant_ban_mod: You can't ban a moderator.
  cant_ban_higher: You can't ban a user with a higher role than you.
  no_reason: No reason provided.
  database_error: >-
    Critical error while updating the database. The developers have been
    notified. The command has been cancelled.
  message:
    dm:
      duration: >-
        You have been banned from **{{guild}}** for **{{duration}}**.
        Reason:```{{reason}}```
      permanent: >-
        You have been permanently banned from **{{guild}}**.
        Reason:```{{reason}}```
    success:
      duration: >-
        {{confirm}} **{{user}}** has been banned for **{{duration}}** (Case
        #{{case}}). The user has been notified via DM.
      permanent: >-
        {{confirm}} **{{user}}** has been permanently banned (Case #{{case}}).
        The user has been notified via DM.
      duration_no_member: >-
        {{confirm}} **{{user}}** has been banned for **{{duration}}** (Case
        #{{case}}).
      permanent_no_member: "{{confirm}} **{{user}}** has been permanently banned (Case #{{case}})."
    fail:
      duration: >-
        {{confirm}} **{{user}}** has been banned for **{{duration}}** (Case
        #{{case}}). The user could not be notified via DM.
      permanent: >-
        {{confirm}} **{{user}}** has been permanently banned (Case #{{case}}).
        The user could not be notified via DM.
  embed:
    title: User Banned
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Joined At**: {{timestamp}}
    fields:
      reason: Reason
  never_joined: User never joined the server.
kick:
  no_reason: No reason provided for kicking.
  cant_kick_yourself: You can't kick yourself.
  no_member: Member not found in the server.
  cant_kick_bot: You can't kick a bot.
  cant_kick_higher: You can't kick a user with a higher role than you.
  cant_kick_mod: You can't kick a moderator.
  cant_kick: This user can't be kicked.
  message:
    dm: "You have been kicked from **{{guild}}**. Reason:```{{reason}}```"
    success: >-
      {{confirm}} **{{user}}** has been kicked (Case #{{case}}). The user has
      been notified via DM.
    fail: >-
      {{confirm}} **{{user}}** has been kicked (Case #{{case}}). The user could
      not be notified via DM.
  clear_fail: Failed to clear the messages.
  fail: Failed to kick the member.
mute:
  no_reason: No reason provided for muting.
  no_member: Member not found. Is the member still in the server?
  no_mute_role: Mute role not found.
  already_muted: User is already muted.
  already_muted_no_punishments: User is already muted but no punishments found. Removing the role.
  not_muted: "A punishment was found, but the user is not muted. Adding the role."
  cant_mute_yourself: You can't mute yourself.
  cant_mute_higher: You can't mute a user with a higher role than you.
  cant_mute_bot: You can't mute a bot.
  cant_mute_mod: You can't mute a moderator.
  message:
    dm: >-
      You have been muted in **{{guild}}** for **{{duration}}**.
      Reason:```{{reason}}```
    success: >-
      {{confirm}} **{{user}}** has been muted for **{{duration}}** (Case
      #{{case}}). The user has been notified via DM.
    fail: >-
      {{confirm}} **{{user}}** has been muted for **{{duration}}** (Case
      #{{case}}). The user could not be notified via DM.
  database_error: >-
    Critical error while updating the database. The developers have been
    notified. The command has been cancelled.
  role_error: >-
    Error while removing or adding roles. I may not have permission to do so.
    Please check the role permissions. The command has been cancelled.
  embed:
    title: User Nickname Changed
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Old Nickname**: {{old_nickname}}
      > **New Nickname**: {{new_nickname}}
register:
  no_member: Member not found. Is the member still in the server?
  no_register_channel: >-
    Register channel not found. Please update the register channel in the
    settings.
  wrong_channel: "You can only register in <#{{channel}}>"
  no_member_role: Member role not found. Please update the member role in the settings.
  already_registered: User is already registered.
  no_male_role: Male role not found. Please update the male role in the settings.
  success: "{{confirm}} **{{user}}** has been registered."
  error: "Error while registering the user. {{error}}"
  no_female_role: Female role not found. Please update the female role in the settings.
  not_valid: The option you provided is not valid. Please provide a valid option.
  roles_update:
    embed:
      title: Roles Updated
      description: |-
        > **User**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Added Roles**: {{added_roles}}
        > **Removed Roles**: {{removed_roles}}
unban:
  no_reason: No reason provided for unbanning.
  no_user: User not found.
  not_banned: User is not banned.
  success: "{{confirm}} **{{user}}** has been unbanned (Case #{{case}})."
  error: "Error while unbanning the user. {{error}}"
  embed:
    title: User Unbanned
    description: |-
      > **User**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
    fields:
      reason: Reason
unmute:
  no_member: Member not found. Is the member still in the server?
  no_reason: No reason provided for unmuting.
  no_mute_role: Mute role not found. Please update the mute role in the settings.
  previous_roles_error: >-
    Failed to reassign previous roles. The following roles couldn't be
    added:```{{roles}}```
  not_muted: >-
    User is not muted. If they appear to be, please remove the role manually.
    Lost roles cannot be restored automatically.
  muted_no_punishments: >-
    User is muted but no punishments found. Removing the role. Lost roles cannot
    be restored automatically.
  success: >-
    {{confirm}} **{{user}}** has been unmuted (Case #{{case}}). The user has
    been notified via DM.
  database_error: >-
    Critical error while updating the database. The developers have been
    notified. The command has been cancelled.
  role_error: >-
    Error while removing the role. The role may have been deleted or I may not
    have permission to remove it.
  dm_error: >-
    {{confirm}} **{{user}}** has been unmuted (Case #{{case}}). The user could
    not be notified via DM.
  dm: "You have been unmuted in **{{guild}}**."
warn:
  no_member: Member not found. Is the member still in the server?
  self_warn: You can't warn yourself.
  bot_warn: You can't warn a bot.
  staff_warn: You can't warn a staff member.
  database_error: >-
    Critical error while updating the database. The developers have been
    notified. The command has been cancelled.
  dm: "You have been warned in **{{guild}}**. Reason:```{{reason}}```"
  success: >-
    {{confirm}} **{{user}}** has been warned (Case #{{case}}). The user has been
    notified via DM.
  dm_error: >-
    {{confirm}} **{{user}}** has been warned (Case #{{case}}). The user could
    not be notified via DM.
config:
  select_menu:
    moderation: Moderation Settings
    register: Register Settings
    welcome_leave: Welcome/Leave Settings
    role: Role Settings
    misc: Miscellaneous Settings
    log: Log Settings
