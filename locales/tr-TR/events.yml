channelUpdate:
  name_change:
    unknown_executor: Bilinmeyen Yetkili
    embed:
      title: Kanal Adı Değiştirildi
      description: |-
        > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Eski Kanal Adı**: {{old_name}}
        > **Yeni Kanal Adı**: {{new_name}}
  topic_change:
    unknown_executor: Bilinmeyen Yetkili
    embed:
      title: Kanal Konusu Değiştirildi
      description: |-
        > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Eski Konu**: {{old_topic}}
        > **Yeni Konu**: {{new_topic}}
  nsfw_change:
    unknown_executor: Bilinmeyen Yetkili
    embed:
      title: Kanal NSFW Durumu Değiştirildi
      description: |-
        > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Eski Durum**: {{old_nsfw}}
        > **Yeni Durum**: {{new_nsfw}}
  permissions_change:
    unknown_executor: Bilinmeyen Yetkili
    embed:
      title: Kanal İzinleri Değiştirildi
      description: |-
        > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
        > **ID**: {{channel.id}}
        > **Değiştirilen İzinler**: {{changes}}
guildBanAdd:
  embed:
    title: Kullanıcı Sunucudan Yasaklandı
    description: |-
      > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Katılma Tarihi**: {{timestamp}}
    fields:
      reason: Sebep
  no_reason: Sebep belirtilmedi.
  unknown_executor: Bilinmeyen Yetkili
  never_joined: Kullanıcı bu sunucuya hiç katılmadı.
guildBanRemove:
  embed:
    title: Kullanıcının Sunucu Yasağı Kaldırıldı
    description: |-
      > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
    fields:
      reason: Sebep
guildMemberAdd:
  embed:
    title: Kullanıcı Sunucuya Katıldı
    description: |-
      > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Hesap Yaşı**: {{timestamp}}
      > **Kullanıcı Sayısı**: {{member_count}}
guildMemberRemove:
  no_reason: Sebep belirtilmedi.
  user_left: "**Kullanıcı {{guild}} sunucusundan ayrıldı**"
  embed:
    title: Kullanıcı Sunucudan Ayrıldı
    title_kicked: Kullanıcı Sunucudan Atıldı
    description: |-
      > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
      > **ID**: {{user.id}}
      > **Katılma Tarihi**: {{timestamp}}
      > **Kullanıcı Sayısı**: {{member_count}}
    fields:
      reason: Sebep
  never_joined: Kullanıcı bu sunucuya hiç katılmadı.
  unknown_executor: Bilinmeyen Yetkili
guildMemberUpdate:
  unknown_executor: Bilinmeyen Yetkili
  timeout:
    no_reason: Zaman aşımı için sebep belirtilmedi.
    embed:
      title: Kullanıcı Zaman Aşımına Uğradı
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Zaman Aşımı Tarihi**: {{timestamp}}
      fields:
        reason: Sebep
  remove_timeout:
    no_reason: Zaman aşımını kaldırmak için sebep belirtilmedi.
    embed:
      title: Kullanıcının Zaman Aşımı Kaldırıldı
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Zaman Aşımı Kaldırma Tarihi**: {{timestamp}}
  roles_update:
    embed:
      title: "Kullanıcı Rolleri Değiştirildi"
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
      added: Eklenen Roller
      removed: Kaldırılan Roller
  nickname_change:
    no_nickname: Takma Ad Yok.
    embed:
      title: Kullanıcın Takma Adı Değişti
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Eski Takma Ad**: {{old_nickname}}
        > **Yeni Takma Ad**: {{new_nickname}}
  username_change:
    embed:
      title: Kullanıcın Kullanıcı Adı Değişti
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
        > **Eski Kullanıcı Adı**: {{old_username}}
        > **Yeni Kullanıcı Adı**: {{new_username}}
  avatar_change:
    embed:
      title: Kullanıcın Avatarı Değişti
      description: |-
        > **Kullanıcı**: {{user.tag}} (<@{{user.id}}>)
        > **ID**: {{user.id}}
guildUpdate:
  unknown_executor: Bilinmeyen Yetkili
  name_change:
    embed:
      title: Sunucu Adı Değiştirildi
      description: |-
        > **Sunucu**: {{guild.name}} (<@{{guild.id}}>)
        > **ID**: {{guild.id}}
        > **Eski Sunucu Adı**: {{old_name}}
        > **Yeni Sunucu Adı**: {{new_name}}
interactionCreate:
  memberMissingPermissions: >-
    Bu komutu kullanabilmek için gerekli `{{permissions}}` izinlerine sahip
    değilsiniz.
messageBulkDelete:
  embed:
    title: "{{count}} Mesaj Silindi"
    description: "> **Kanal**: {{message.channel.name}} (<#{{message.channel.id}}>)"
  file_name: silinen_mesajlar.txt
  message: >-
    **Mesaj ID:** {{message.id}} **Kullanıcı:** {{message.author.tag}}
    **İçerik:** {{message.content}}
messageCreate:
  mod_mail:
    blacklisted: >-
      {{guild}} sunucusunda mod mail kullanmanız yasaklandı. Yasaklanma
      sebebiniz: **{{reason}}**. Yasaklanma süresinin kalkışı: **{{expires}}**.
    never: Asla
    initial: >-
      `Hesap Yaşı:` **{{account_age}}**, `ID:` **{{user.id}}**

      `Kullanıcı Adı:` **{{user.username}}** (<@{{user.id}}>), `Katılma Tarihi:`
      **{{join_date}}**

      **»»----------------------------¤----------------------------««**
    not_member: Sunucunun bir üyesi değilsiniz.
    confirm: Evet
    cancel: Hayır
    confirm_title: Mod Mail Onaylama Düğmesi
    confirm_description: >-
      {{guild}} için mod mail konuşmasını onaylamak için aşağıdaki düğmeye
      tıklayın veya konuşmayı iptal etmek için iptal düğmesine tıklayın.
    timeout: >-
      Cevap vermeniz için çok uzun süre bekledim. Mod mail konuşması iptal
      edildi.
    cancelled_title: Mod Mail Konuşması İptal Edildi
    cancelled_description: "{{guild}} için mod mail konuşması iptal edildi."
    confirmed_title: Mod Mail Konuşması Onaylandı
    confirmed_description: "{{guild}} için mod mail konuşması onaylandı ve konuşma başladı."
    parent_channel_missing: >-
      Üst kanal eksik. Modlar mod mail'in çalışması için üst kanalı
      ayarlamalıdır.
    channel_missing: Kanal eksik. Modlar mod mail'in çalışması için kanalı ayarlamalıdır.
    topic: "{{user}} ile Mod Mail konuşması"
    error_sending: Mesaj göndermeye çalışırken bir hata oluştu.
    reopened: "{{user}} modmaile cevap verdi, konuşma kapanmayacak. ({{closer}})"
    error_inserting: Mesajı veritabanına eklemeye çalışırken bir hata oluştu.
messageDelete:
  embed:
    title: Mesaj Silindi
    description: >-
      > **Kanal**: {{message.channel.name}} (<#{{message.channel.id}}>)

      > **Kullanıcı**: {{message.author.tag}} (<@{{message.author.id}}>)

      > **Mesaj ID**:
      [{{message.id}}](https://discord.com/channels/{{message.guild.id}}/{{message.channel.id}}/{{message.id}})

      > **Mesaj Oluşturulma Tarihi**: {{timestamp}}
    fields:
      content: Mesaj
      attachments: "{{count}} Ek Dosya"
  skipped_files: ⚠️ Büyük Dosyalar Atlandı
messageUpdate:
  message_edit: |-
    ***Kullanıcı mesajını düzenledi.***
    ```diff
    - {{oldContent}}
    + {{newContent}}
    ```
  embed:
    title: Mesaj Düzenlendi
    description: >-
      > **Kanal**: {{message.channel.name}} (<#{{message.channel.id}}>)

      > **Kullanıcı**: {{message.author.tag}} (<@{{message.author.id}}>)

      > **Mesaj ID**:
      [{{message.id}}](https://discord.com/channels/{{message.guild.id}}/{{message.channel.id}}/{{message.id}})
    fields:
      oldContent: Önceden
      newContent: Sonra
