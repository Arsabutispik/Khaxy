      embed:
        title: Forum Kanalı Etiket Güncellendi
        description: |-
          > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
          > **ID**: {{channel.id}}
          > **İsim**: ~~{{old_tag_name}}~~ -> {{new_tag_name}}
          > **Moderatörlere Özel**: ~~{{old_tag_moderation_only}}~~ -> {{new_tag_moderation_only}}
          > **Emoji**: ~~{{old_tag_emoji}}~~ -> {{new_tag_emoji}}
