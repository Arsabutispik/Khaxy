      embed:
        title: Forum Kanalı Etiket Silindi
        description: |-
          > **Kanal**: {{channel.name}} (<#{{channel.id}}>)
          > **ID**: {{channel.id}}
          > **İsim**: {{tag_name}}
          > **Moderatörlere Özel**: {{tag_moderation_only}}
          > **Emoji**: {{tag_emoji}}
