        > **ID**: {{user.id}}
        > **Eski Ses Kanalı**: {{oldChannel.name}} (<#{{oldChannel.id}}>)
        > **Yeni Ses Kanalı**: {{newChannel.name}} (<#{{newChannel.id}}>)
